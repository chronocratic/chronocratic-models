name: Protected Files Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - pyproject.toml
      - .vscode/**

jobs:
  check-pyproject:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check pyproject.toml
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const target = 'pyproject.toml';
            const changed = files.find(f => f.filename === target);
            if (!changed) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **pyproject.toml** — Build Configuration\n\n` +
                `This PR modifies \`pyproject.toml\` (${changed.status}), which controls ` +
                `dependencies, build settings, and project metadata for all users.\n\n` +
                `Core maintainers should verify:\n` +
                `- New dependencies are necessary and pinned\n` +
                `- Build/tool configurations don't break the CI pipeline\n` +
                `- Changes are backward-compatible\n\n` +
                `See [Contributing](../blob/main/docs/contributing.md#protected-project-files) for policy.`
            });

  check-vscode-settings:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check .vscode settings
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const targets = files.filter(f => f.filename.startsWith('.vscode/'));
            if (targets.length === 0) return;

            const lines = targets.map(f =>
              `- \`${f.filename}\` (${f.status})`
            ).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **.vscode settings** — Editor Configuration\n\n` +
                `This PR modifies ${targets.length} VS Code setting file(s), which controls ` +
                `linting, formatting, and type-checking for the team:\n\n` +
                `${lines}\n\n` +
                `Core maintainers should verify:\n` +
                `- Settings don't conflict with CI tooling (ruff, ty)\n` +
                `- Changes benefit all contributors, not local preferences\n\n` +
                `See [Contributing](../blob/main/docs/contributing.md#protected-project-files) for policy.`
            });
