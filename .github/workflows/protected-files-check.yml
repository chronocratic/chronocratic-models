  check-pre-commit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check .pre-commit-config.yaml
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- protected-files-check:pre-commit -->';

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const changed = files.find(f => f.filename === '.pre-commit-config.yaml');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));

            const baseRef = context.payload.pull_request.base.ref;
            const docUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}` +
